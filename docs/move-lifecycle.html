<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monarch — org moves</title>
<style>
  :root {
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e;
    --muted: #898781; --grid: #e1e0d9; --border: rgba(11, 11, 11, 0.10);
    --blue: #2a78d6; --aqua: #1baf7a; --violet: #4a3aa7; --orange: #eb6834;
    --magenta: #e87ba4; --yellow: #eda100; --good: #006300; --bad: #d03b3b;
    --edge: #b6b4ac;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7;
      --muted: #898781; --grid: #2c2c2a; --border: rgba(255, 255, 255, 0.10);
      --blue: #3987e5; --aqua: #199e70; --violet: #9085e9; --orange: #d95926;
      --magenta: #d55181; --yellow: #c98500; --good: #0ca30c; --bad: #d03b3b;
      --edge: #55534d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 18px 24px 40px; }

  header { display: flex; justify-content: space-between; align-items: baseline;
           gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; }
  h1 small { color: var(--ink-2); font-weight: 400; font-size: 14px; margin-left: 8px; }
  .status { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  #stepper { display: flex; gap: 10px; list-style: none; margin: 0; padding: 0;
             color: var(--muted); font-size: 13px; }
  #stepper li.done::before { content: "✓ "; color: var(--good); }
  #stepper li.now { color: var(--ink); font-weight: 600; }
  /* the page's only control: solid while it is your turn, quiet while the move is working */
  .cta { border: 1px solid var(--blue); border-radius: 999px; padding: 4px 14px;
         font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
         background: var(--blue); color: #fff;
         transition: background 0.15s, color 0.15s, border-color 0.15s; }
  .cta:hover { box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 25%, transparent); }
  .cta:disabled { background: none; color: var(--muted); border-color: var(--border);
                  font-weight: 400; cursor: default; box-shadow: none; }
  /* a ring breathing outward while it is your turn -- the page does nothing until this is
     pressed, so it has to say so without a caption. Stops once the pointer finds it, and while
     the move is working there is nothing to press, so a disabled button never pulses. */
  .cta:not(:disabled) { animation: nudge 2.6s ease-out infinite; }
  .cta:not(:disabled):hover { animation: none; }
  @keyframes nudge {
    0%   { box-shadow: 0 0 0 0 color-mix(in srgb, var(--blue) 45%, transparent); }
    70%  { box-shadow: 0 0 0 8px color-mix(in srgb, var(--blue) 0%, transparent); }
    100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--blue) 0%, transparent); }
  }
  @media (prefers-reduced-motion: reduce) { .cta { animation: none !important; } }
  #banner { color: var(--ink-2); margin: 6px 0 14px; min-height: 1.4em; }

  .layout { display: grid; grid-template-columns: 1fr 290px; gap: 16px; align-items: start; }
  .main { min-width: 0; }
  .card { background: var(--surface); border: 1px solid var(--border);
          border-radius: 10px; padding: 14px 16px; }
  .card h2 { font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
             text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .card h2 .help { display: inline-flex; align-items: center; justify-content: center;
                   width: 13px; height: 13px; margin-left: 6px; vertical-align: 1px;
                   border: 1px solid var(--border); border-radius: 999px;
                   font-size: 9px; color: var(--muted); cursor: help; }

  /* ---- the store graph ---- */
  .graph { position: relative; padding: 6px 0 2px; }
  /* layered between the spine row and the store row: an edge ends at the chip it binds to, which
     sits inside the static card, so the line has to paint over that card's padding to reach it.
     Store cards stay above, so nothing is drawn across their faces */
  .graph svg { position: absolute; inset: 0; width: 100%; height: 100%;
               pointer-events: none; z-index: 2; }
  /* wraps rather than overflowing if the column ever gets narrower than the row -- edges are
     drawn from measured positions, so they follow */
  .grow { position: relative; display: flex; justify-content: center; gap: 10px;
          flex-wrap: wrap; margin-bottom: 52px; z-index: 1; align-items: stretch; }
  .grow:last-child { margin-bottom: 4px; z-index: 3; }

  .staticcard { background: var(--surface); border: 1.5px solid var(--grid);
               border-radius: 10px; padding: 8px 16px 10px; }
  .staticlab { font-size: 10px; font-weight: 700; letter-spacing: 0.07em;
              text-transform: uppercase; color: var(--muted); text-align: center;
              margin-bottom: 7px; }
  .minis { display: flex; gap: 12px; justify-content: center; }
  .mini { display: flex; gap: 9px; align-items: baseline; border: 1px solid var(--grid);
          border-radius: 6px; padding: 4px 11px; font-size: 12.5px; }
  .mini b { font-weight: 600; }
  .mini .mv { color: var(--ink-2); font-variant-numeric: tabular-nums; }

  /* sized so the longest name still sits beside its chip without ellipsizing -- a store's name
     is its identity. The row and the side pane compete for the same pixels */
  .snode { width: 160px; background: var(--surface); border: 1.5px solid var(--grid);
           border-radius: 8px; padding: 8px 10px; cursor: pointer;
           transition: border-color 0.25s, box-shadow 0.25s, opacity 0.25s; }
  .snode:hover { border-color: var(--edge); }
  .nm { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
  .nm b { font-size: 13px; font-weight: 600; flex: 1; min-width: 0;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* the table count is also the control that opens this store's walk. A chip, so it reads as
     something to press before the pointer arrives -- hover alone can't advertise itself, and the
     walk is the most substantial thing on the page to leave undiscovered. */
  .kind { font-size: 9.5px; font-weight: 600; letter-spacing: 0.06em;
          text-transform: uppercase; color: var(--muted); margin-top: 1px; }
  .ustat.run { color: var(--blue); }
  .tbls { margin-top: 5px; }
  .st { font-size: 11.5px; color: var(--muted); display: inline-block;
        border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px;
        background: color-mix(in srgb, var(--grid) 40%, transparent);
        transition: background 0.15s, border-color 0.15s, color 0.15s; }
  .snode:hover .st { border-color: var(--edge); color: var(--ink-2);
                     background: color-mix(in srgb, var(--grid) 90%, transparent); }
  .ck { font-size: 11px; flex: none; }
  .ck.hit { color: var(--good); }
  .ck.wait { color: var(--muted); }
  .ck.live { color: var(--aqua); font-weight: 600; animation: blink 2.8s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: 0.72; } }
  .copying { border-color: var(--blue) !important;
             box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 18%, transparent); }
  .flash { border-color: var(--aqua) !important;
           box-shadow: 0 0 0 3px color-mix(in srgb, var(--aqua) 18%, transparent); }
  .dimmed { opacity: 0.35; }
  .s-default { color: var(--blue); }
  .s-attachments { color: var(--violet); }
  .s-files { color: var(--aqua); }
  .s-crons { color: var(--orange); }
  .s-metrics { color: var(--magenta); }

  path.edge { fill: none; stroke: var(--edge); stroke-width: 1.4; opacity: 0.45; }
  /* grey at rest whether or not it crosses a database: most stores do, so colouring that case
     tinted nearly every edge. The aqua arrives on hover, with the label that says which it is.
     Declared before .active so a copying edge stays blue even while hovered */
  path.edge.hi { stroke: var(--aqua); opacity: 1; stroke-width: 2.2; }
  path.edge.active { stroke: var(--blue); stroke-width: 2.2; opacity: 1;
                     stroke-dasharray: 7 5; animation: crawl 0.5s linear infinite; }
  path.edge.live { stroke-dasharray: 7 5; animation: crawl 1.4s linear infinite; }
  /* scope edges are drawn child->parent (FK direction); reverse their crawl so flow always
     reads outward, from the parents the whole move resolves against */
  path.edge.up.active, path.edge.up.live { animation-direction: reverse; }
  path.edge.dim { opacity: 0.08; }
  @keyframes crawl { to { stroke-dashoffset: -12; } }
  text.elabel { font: 10px system-ui, sans-serif; fill: var(--muted);
                opacity: 0; transition: opacity 0.2s; }
  text.elabel.cross { fill: var(--aqua); }
  text.elabel.show { opacity: 1; }

  #tip { position: fixed; z-index: 10; display: none; max-width: 280px;
         background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
         box-shadow: 0 4px 16px rgba(0,0,0,0.15); padding: 8px 11px; font-size: 12.5px;
         pointer-events: none; }
  #tip b { font-size: 13px; }
  #tip .l { color: var(--ink-2); margin-top: 2px; }
  #tip .l span { color: var(--ink); }

  /* a store's detail is clicked, not hovered -- it holds an expandable tree, so unlike #tip it
     takes pointer events and stays until dismissed */
  #storepop { position: fixed; z-index: 20; display: none; width: 350px;
              background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
              box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18); padding: 8px 12px 10px;
              font-size: 12.5px; line-height: 1.5; color: var(--ink-2); }
  #storepop.open { display: block; }
  #storepop b { color: var(--ink); font-size: 13px; }
  #storepop .l { margin-top: 2px; }
  #storepop .l span { color: var(--ink); }
  #storepop .x { float: right; cursor: pointer; color: var(--muted); margin-left: 8px; }
  /* the walk: this store's tables nested under whatever scopes them, collapsed until clicked */
  .treelab { font-size: 10px; font-weight: 700; letter-spacing: 0.07em;
             text-transform: uppercase; color: var(--muted); margin-top: 8px;
             padding-top: 7px; border-top: 1px solid var(--grid); }
  /* the nesting is what scopes what; the sequence is a different graph -- one edge per table
     here, every ref there -- so the order gets said rather than left to be inferred */
  .treenote { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .tree { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
          max-height: 320px; overflow: auto; margin-top: 5px; }
  .tree summary { cursor: pointer; list-style: none; padding: 1px 0; }
  .tree summary::-webkit-details-marker { display: none; }
  .tree summary::before { content: "▸"; display: inline-block; width: 11px; color: var(--muted); }
  .tree details[open] > summary::before { content: "▾"; }
  .tree .kids { margin-left: 5px; padding-left: 8px; border-left: 1px solid var(--grid); }
  .tree .leaf { padding: 1px 0 1px 11px; }
  .tree .by { color: var(--muted); }
  .tree .n { color: var(--ink-2); font-variant-numeric: tabular-nums; }

  /* ---- side panel ---- */
  .side .card { margin-bottom: 16px; }
  .lagbar { height: 4px; border-radius: 2px; background: var(--grid); overflow: hidden;
            margin: 1px 0 7px; }
  .lagbar div { height: 100%; width: 0%; background: var(--blue); border-radius: 2px;
                transition: width 0.3s, background 0.3s; }
  #drainrows .kv { font-size: 12.5px; padding: 2px 0; gap: 10px; }
  #drainrows .kv span:first-child { min-width: 0; overflow: hidden;
                                    text-overflow: ellipsis; white-space: nowrap; }
  #drainrows .kv span:last-child { color: var(--ink-2); white-space: nowrap; }
  #drainrows .kv span.hit { color: var(--good); }
  .quietbar div { background: var(--aqua); }        /* draining, distinct from lag blue */
  .quietbar div.done { background: var(--good); }   /* quiet >= GRACE: drained */
  /* not-ready cue: the unfilled track is faintly red until drained, so red recedes as it fills */
  .quietbar.pending { background: color-mix(in srgb, var(--bad) 18%, var(--grid)); }
  #snap-stores .kv { font-size: 12.5px; }
  .unitrow { cursor: help; }
  .unitrow:hover { background: color-mix(in srgb, var(--grid) 45%, transparent); }
  /* the reading stays on one line; a long store name ellipsizes instead of pushing it to two */
  #snap-stores .kv span:first-child { min-width: 0; overflow: hidden;
                                      text-overflow: ellipsis; white-space: nowrap; }
  #snap-stores .kv span:last-child { color: var(--ink-2); flex: none; white-space: nowrap; }
  #snap-stores .kv span.hit { color: var(--good); }
  .kv { display: flex; justify-content: space-between; font-size: 13px;
        color: var(--ink-2); padding: 2px 0; font-variant-numeric: tabular-nums; }
  .kv span:last-child { color: var(--ink); }

  /* ---- feed ---- */
  .feed { margin-top: 16px; }
  .feed ol { list-style: none; margin: 0; padding: 0; max-height: 240px;
             overflow-y: auto; font-size: 13px; }
  .feed li { display: flex; gap: 10px; padding: 3px 0; border-bottom: 1px solid var(--grid);
             align-items: baseline; }
  .feed li:last-child { border-bottom: 0; }
  .feed .t { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  /* the chip is the unit the line came from (move_event.unit), tinted to match that unit's card
     above; `move` = org-level, which is where the operator's intent and the phase transitions
     land. Narration is the page's own voice -- the ledger has no equivalent -- so it gets no chip */
  .chip { flex: none; width: 128px; font-size: 10.5px; font-weight: 600;
          letter-spacing: 0.04em; text-transform: uppercase; }
  .chip::before { content: "●"; margin-right: 5px; font-size: 8px; vertical-align: 1px; }
  .chip.u-move { color: var(--muted); }
  .chip.u-move::before { content: none; }
  .x { color: var(--ink); overflow-wrap: anywhere; }
  li.narration .x { color: var(--ink-2); font-style: italic; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Monarch <small id="sub">moving org 1 (evil-corp): source → sink</small></h1>
    <div class="status">
      <ol id="stepper"></ol>
      <button id="go" class="cta">▶ start the move</button>
    </div>
  </header>
  <p id="banner"></p>

  <div class="layout">
    <div class="main">
      <article class="card">
        <div class="graph" id="graph"><svg id="edges"></svg></div>
      </article>
      <article class="card feed"><h2>feed</h2><ol id="feed"></ol></article>
    </div>

    <div class="side">
      <article class="card">
        <h2>snapshot<span class="help" data-help="snapshot">?</span></h2>
        <div id="snap-stores"></div>
      </article>
      <article class="card">
        <h2>stream<span class="help" data-help="stream">?</span></h2>
        <div id="lagrows"></div>
      </article>
      <article class="card">
        <h2>drain readiness<span class="help" data-help="drain">?</span></h2>
        <div id="drainrows"></div>
      </article>
    </div>
  </div>
</div>
<div id="tip"></div>
<div id="storepop"></div>

<script>
// Mockup only: the store layout mirrors postgres_config.yaml + fleet.yaml; numbers and the
// timeline are simulated. The real version replaces the timeline with polling /state.
const $ = id => document.getElementById(id);

// ---- the catalog (manifest-shaped) ----
const COUNT = {
  organization: 1, project: 21, release: 41200, commit: 1240000, apikey: 34,
  orgauthtoken: 12, group: 2400000, promptsactivity: 86000, releaseproject: 58300,
  groupinbox: 124000, groupassignee: 46800, grouprelease: 917000, grouphash: 3140000,
  groupredirect: 212000, eventattachment: 484000, userreport: 27400, file: 618000,
  monitor: 320, monitorenvironment: 1100, monitorcheckin: 4310000, monitorincident: 8600,
  monitorenvbrokendetection: 240, stringindexer: 96000,
};
// the root plus every table declared static: what a cross-store edge is allowed to bind to
const STATIC_PARENTS = ["organization", "project"];
const FROZEN = new Set(["project"]);
const STORES = [
  // every store is its own pipeline in this example: own database, slot, snapshot, stream
  { name: "default",
    tables: ["release", "commit", "apikey", "orgauthtoken", "group", "promptsactivity",
             "releaseproject", "groupinbox", "groupassignee", "grouprelease",
             "grouphash", "groupredirect"] },
  { name: "attachments", cross: true, scope: "project_id",
    tables: ["eventattachment", "userreport"] },
  { name: "files", cross: true, scope: "project_id", tables: ["file"] },
  // its tables scope through each other, so not every one binds to a static parent directly: the
  // walk has depth inside one store as well as across them
  { name: "crons", cross: true, scope: "project_id",
    tables: ["monitor", "monitorenvironment", "monitorcheckin", "monitorincident",
             "monitorenvbrokendetection"] },
  // binds to the root rather than to project -- a cross-store edge resolves against whichever
  // static parent scopes it, and both are in play across the fleet
  { name: "metrics", cross: true, scope: "organization_id", tables: ["stringindexer"] },
];
// what scopes each table: [column, parent] in declaration order, the manifest's `refs` shape.
// A table usually lists several -- the walk uses exactly one of them (scopeEdge below).
const REFS = {
  project:         [["organization_id", "organization"]],
  release:         [["organization_id", "organization"]],
  commit:          [["organization_id", "organization"]],
  apikey:          [["organization_id", "organization"]],
  orgauthtoken:    [["organization_id", "organization"]],
  promptsactivity: [["organization_id", "organization"], ["project_id", "project"]],
  groupredirect:   [["organization_id", "organization"], ["group_id", "group"]],
  groupinbox:      [["organization_id", "organization"], ["project_id", "project"],
                    ["group_id", "group"]],
  group:           [["project_id", "project"]],
  grouphash:       [["project_id", "project"], ["group_id", "group"]],
  groupassignee:   [["group_id", "group"], ["project_id", "project"]],
  grouprelease:    [["group_id", "group"], ["project_id", "project"]],
  releaseproject:  [["release_id", "release"], ["project_id", "project"]],
  eventattachment: [["project_id", "project"], ["group_id", "group"]],
  userreport:      [["project_id", "project"], ["group_id", "group"]],
  file:            [["project_id", "project"]],
  monitor:         [["project_id", "project"]],
  monitorcheckin:  [["project_id", "project"], ["monitor_id", "monitor"]],
  // no static parent listed, so these fall through to the dynamic edge -- which is what gives
  // crons depth inside its own store
  monitorenvironment:        [["monitor_id", "monitor"]],
  monitorincident:           [["monitorenvironment_id", "monitorenvironment"]],
  monitorenvbrokendetection: [["monitorenvironment_id", "monitorenvironment"]],
  stringindexer:   [["organization_id", "organization"]],
};
// the one edge that actually scopes a table: a static parent when one is listed -- its id set
// can't change mid-move, so it is the cheapest filter and makes the scope independent of ref
// order -- else the first parent. Ports config.py's scope_edge, and it is why grouprelease hangs
// off project rather than group despite listing group_id first.
const scopeEdge = t => {
  const refs = REFS[t] ?? [];
  return refs.find(([, p]) => STATIC_PARENTS.includes(p)) ?? refs[0] ?? null;
};
// physical placement (fleet-shaped) lives in tooltips, not the diagram
const PHASES = ["setup", "snapshot", "streaming", "freeze", "cutover", "cleanup"];

const sink = {}, sourceN = {};
for (const n of Object.keys(COUNT)) { sourceN[n] = COUNT[n]; sink[n] = 0; }
const storeOf = {};
for (const s of STORES) for (const t of s.tables) storeOf[t] = s.name;
for (const t of STATIC_PARENTS) storeOf[t] = "default";  // the spine lives in default
// declaration order is already topological -- the static parents, then each store's tables
// parents-first -- which is also the order the copy walks them
const WALK = [...STATIC_PARENTS, ...STORES.flatMap(s => s.tables)];

// this store's tables, each nested under whichever table scopes it. The top level is what the
// store's walk starts from: the root when it lives here, otherwise the cross-store parents its
// tables hang off -- the same edge the diagram draws. Ports dashboard.py's build_scope_tree.
function buildScopeTree(store) {
  const mine = WALK.filter(t => storeOf[t] === store);
  const kidsOf = new Map();
  for (const t of mine) {
    const parent = scopeEdge(t)?.[1] ?? null;
    if (!kidsOf.has(parent)) kidsOf.set(parent, []);
    kidsOf.get(parent).push(t);
  }
  const node = t => {
    const children = (kidsOf.get(t) ?? []).map(node);
    // subtree size, so a collapsed branch still says how much it hides
    return { table: t, children,
             count: children.length + children.reduce((n, k) => n + k.count, 0) };
  };
  const roots = [];
  for (const [parent, tables] of kidsOf) {
    if (mine.includes(parent)) continue;  // an edge inside the store: already nested
    if (parent === null) roots.push(...tables.map(node));  // the root lives here
    // a cross-store parent still heads its branch: it is what these tables hang off, and
    // `store` says it isn't one of ours
    else roots.push({ ...node(parent), store: storeOf[parent] });
  }
  return roots;
}

// ---- build the graph DOM: the static parents, then one card per store ----
const graphEl = $("graph"), svg = $("edges");
// name, then kind · status, then the table count -- the same order the live dashboard's node
// uses. The count sits on its own line rather than beside the name: nothing competes with a long
// store name for width, and the chip reads as a control instead of a suffix
const storeCard = s => `
  <div class="snode" id="s-${s.name}" data-node="s-${s.name}">
    <div class="nm"><b class="s-${s.name}">${s.name}</b></div>
    <div class="kind">postgres<span class="ustat" id="ustat-${s.name}"></span></div>
    <div class="tbls"><span class="st">${s.tables.length} table${
      s.tables.length > 1 ? "s" : ""}</span></div>
  </div>`;
graphEl.insertAdjacentHTML("beforeend", `
  <div class="grow">
    <div class="staticcard" id="static" data-node="static">
      <div class="staticlab">fixed for the move — every cross-store edge binds here</div>
      <div class="minis">${STATIC_PARENTS.map(n =>
        `<div class="mini" id="m-${n}"><b>${FROZEN.has(n) ? "📌 " : ""}${n}</b>` +
        `<span class="mv" id="tv-${n}">0 / ${COUNT[n]}</span>` +
        `<span class="ck wait" id="tk-${n}">…</span></div>`).join("")}
      </div>
    </div>
  </div>
  <div class="grow">${STORES.map(storeCard).join("")}</div>`);

// ---- refresh: table rows roll up into store aggregates ----
const fmtC = n => n < 10000 ? n : Intl.NumberFormat("en",
  { notation: "compact", maximumFractionDigits: 1 }).format(n);
const glyph = (el, hit) => {
  el.textContent = hit ? "✓" : "…";
  el.className = el.className.replace(/hit|wait/, hit ? "hit" : "wait");
};
// the card's one line shows the store's current state: counts while copying, seconds-behind
// while its stream runs (streams never complete), counts again once moved
// marker semantics: ? nothing traversed · + partial exact, walk underway · plain = complete

// Nothing runs on its own: the move waits at every phase boundary for you to advance it. One
// control, always in the same place, and only ever one thing it can mean -- solid and named
// when it is your turn, quiet and naming the current phase while the move is working.
let goNow = false, onGo = null;
const gate = async label => {
  setCta(label);

  goNow = false;
};
// what the button says while the move is working -- the phase, in its own voice. This used to be
// a separate pill, which stated the phase a third time next to the stepper and the button
const WORKING = { setup: "setting up…", snapshot: "copying…", streaming: "streaming…",

                  done: "✓ moved" };
function setCta(label) {

      sink[name] = Math.round(target * ++i / steps);

  Object.keys(sourceN).forEach(refreshTable);
  for (const n of Object.keys(tails)) {
    tails[n] = null;
    applied[n] = 0; feedAt[n] = 0; feedCount[n] = 0;
  }
  for (const n of Object.keys(quiet)) quiet[n] = null;
  sized.clear();

  feed(null, "every line below says which unit wrote it; `move` is the org-level journal, one line per operator request and phase change");
  await gate("next: snapshot ›"); if (!alive()) return;

  // which is what makes the other stores' row filters sound. The rows themselves are default's

  const staticCard = $("static");
  staticCard.classList.add("copying");

  // floor has nothing pulling it back down, so streams that had caught up crept upward and never
  // converged. One exponential does both jobs -- drains a backlog in ~9s of real time, then holds
  // every stream near the fixed point, 0.18 / (1 - 0.82) ≈ 1s behind.
  const settle = v => v === null ? null
    : Math.max(0.3, v * 0.82 + 0.18 + (Math.random() - 0.5) * 0.5);
  const startJitter = () => {
    const id = setInterval(() => {
      if (!alive()) return clearInterval(id);
      for (const n of Object.keys(tails)) tails[n] = settle(tails[n]);
      for (const n of Object.keys(quiet)) if (quiet[n] !== null) quiet[n] += 0.4;
      // a write burst -- only while writes are still happening: past the stop the org is quiet by
      // definition, and a burst there would empty default's drain bar for no reason
      if (phaseNow === "streaming" && tails.default !== null && Math.random() < 0.04)
        tails.default += 25;
      renderSide();
    }, 400);
    return id;
  };
  let jitter = startJitter();
  const backlog = { default: 90, attachments: 15, files: 25, crons: 60, metrics: 8 };
  const startStream = name => {
    tails[name] = backlog[name];
    const e = SEDGES.find(x => x.from === `s-${name}` && x.kind === "scope");
    if (e) paths[`${e.from}->${e.to}`].classList.add("live");
    feed(name, `stream live — draining ${backlog[name]}s of backlog accrued since its slot was created`);
  };
  // one publication pair and one slot per store, named for the org and the store, so nothing
  // here is fleet-wide -- and the same name is what teardown drops at the end
  const pubName = name => `monarch_org_1_${name}`;
  // default owns the spine rows as well: organization and project are copied inside its own walk,
  // parents-first like anything else it holds -- there is no separate spine copy step
  const walkOf = s => s.name === "default" ? [...STATIC_PARENTS, ...s.tables] : s.tables;
  const runStore = async s => {
    // workers poll for the trigger independently, so they don't pick it up in lockstep -- and the
    // stagger is what keeps each store's setup pair together in the feed instead of interleaved
    await wait(STORES.indexOf(s) * 260); if (!alive()) return;
    const t0 = Date.now();
    startedAt[s.name] = t0;  // the row has no space for it; it rides in the hover instead
    const durEl = $(`sdur-${s.name}`);
    // rows actually copied, counting up -- never a fraction. There is no denominator to divide
    // by until the copy ends: the only number available in advance is the planner's guess, and
    // it only stands in until the first table lands (dashboard.html's snapLine)
    const tick = setInterval(() => {
      if (!alive()) return clearInterval(tick);
      const got = storeTotals(s).got;
      durEl.textContent = got ? `copying… ${fmtC(got)} rows` : "copying…";
    }, 300);
    const card = $(`s-${s.name}`);
    const e = SEDGES.find(x => x.from === `s-${s.name}` && x.kind === "scope");
    const edge = e ? paths[`${e.from}->${e.to}`] : null;
    card.classList.add("copying");
    edge?.classList.add("active");
    // each mover creates its own plumbing when it starts copying -- one publication pair and one
    // slot per store, named for the org and the store, so nothing here is fleet-wide
    const pub = pubName(s.name);
    const lsn = `0/${(0x1a2b3c0 + STORES.indexOf(s) * 0x4e21).toString(16).toUpperCase()}`;
    // the same worker creates both, back to back, so they stay adjacent: publications first, then
    // the slot that reads them
    feed(s.name, `publications created: ${pub}_ins/${pub}_mut`);
    feed(s.name, `slot created: ${pub} at ${lsn} — exporting its own consistent snapshot`);
    await wait(400); if (!alive()) return;
    for (const t of walkOf(s)) {
      if (!alive()) break;
      sized.add(t);  // the walk resolves this table's ids: its count exists from here on
      refreshTable(t);
      await wait(150);
      await copyIn(t, sourceN[t], 1400);
      if (!alive()) break;
      await wait(250);
    }
    card.classList.remove("copying");
    edge?.classList.remove("active");
    clearInterval(tick);
    if (alive()) {
      // rows first, elapsed after -- the rows are the fact about the move, the seconds are
      // only how long it took (dashboard.html's snapLine, same order)
      copiedRows[s.name] = storeTotals(s).got;  // frozen here; streaming keeps growing the store
      durEl.textContent =
        `✓ ${fmtC(copiedRows[s.name])} rows · ${((Date.now() - t0) / 1000).toFixed(1)}s`;
      durEl.classList.add("hit");
      // the store's one copy-phase line: how many rows it moved, nothing per table
      feed(s.name, `copied: ${fmtC(storeTotals(s).got)} rows across ${s.tables.length} tables`);
    }
  };
  await Promise.all(STORES.map(runStore));
  if (!alive()) return;
  renderSide();
  feed("move", "snapshot complete — a bounded job: a consistent copy as of each database's slot LSN");
  await gate("next: streaming ›"); if (!alive()) return;

  setPhase("streaming", "every store's stream goes live and drains the backlog its slot has been holding; runs until cutover");
  feed("move", "stream requested");
  for (const s of STORES) startStream(s.name);
  feed(null, "started together here, as the CLI's snapshot-then-stream does; in production each store's stream goes live the moment its own snapshot ends — a slot pins WAL from creation, so waiting only grows the backlog it has to drain");
  feed(null, "each stream applies one source transaction at a time, at its commit marker; the feed records what each stream applied — a cumulative count per store, never a line per row");
  // at this scale nothing is logged per row or per table: each stream's only streaming-phase line
  // is its running applied count. files and metrics are deliberately absent from the traffic below:
  // a store with nothing of the org's in its WAL should be visibly silent, and the news-only feed
  // line is what makes that legible.
  const BATCH_MIX = [["grouphash", 140, 260], ["group", 40, 90], ["groupinbox", 25, 55],
                     ["grouprelease", 15, 40], ["commit", 8, 25], ["eventattachment", 12, 30],
                     ["monitorcheckin", 60, 140]];
  const batch = async () => {
    const writes = [];
    for (const [t, lo, hi] of BATCH_MIX) {
      const k = lo + Math.floor(Math.random() * (hi - lo));
      sourceN[t] += k;
      writes.push([t, k]);
      refreshTable(t);
    }
    if (tails.default !== null) tails.default += 2;
    if (tails.attachments !== null) tails.attachments += 1;
    if (tails.crons !== null) tails.crons += 2;
    renderSide();
    await wait(900); if (!alive()) return;
    for (const [t, k] of writes) {
      sink[t] += k;
      refreshTable(t);
    }
    flash("grouphash");
    renderSide();
    // a batch spans stores, and each store's mover accounts only for its own share
    const byStore = {};
    for (const [t, k] of writes) (byStore[storeOf[t]] ??= []).push(k);
    for (const [st, ks] of Object.entries(byStore)) {
      applied[st] += ks.reduce((sum, k) => sum + k, 0);
      quiet[st] = 0;  // the last-applied clock the drain card reads; silent stores stay null
      feedApplied(st);  // cumulative, and only if this store has news and hasn't spoken recently
    }
    // the trailing pause is where the operator's click lands, so let it break out early rather
    // than making them wait out a whole batch
    for (let i = 0; i < 24 && !goNow; i++) await wait(100);
  };
  await batch(); if (!alive()) return;
  await batch(); if (!alive()) return;
  // streaming has no natural end: it trickles on until writes are stopped, which is an operator
  // decision. The doc has no controls of its own, so it plays the decisions rather than offering
  // them, and narrates the exits it can no longer take.
  feed(null, "streaming never finishes — stopping writes is an operator decision, taken while the streams are caught up");
  feed(null, "giving up costs nothing until the flip: the org never left the source, so an abort tears down the plumbing and the move ends there");
  // the org keeps writing until it is told to stop. Parked here with the streams idle, the quiet
  // clocks would climb to 30s and the drain card would call the org drained while traffic is
  // still notionally flowing -- and the freeze would then open with its straggler already due
  setCta("next: stop writes ›");
  while (alive() && !goNow) await batch();
  if (!alive()) return;
  goNow = false;

  setPhase("freeze", "writes stopped — now we just watch: quiet time is the evidence");
  feed("move", "operator: stop writes");
  feed("move", "writes for evil-corp stopped at the edge — new traffic buffers against the flip");
  feed("move", `one check from here: seconds since any stream saw an org change, lag-corrected — ${GRACE}s of silence means the queues are empty AND everything ours is applied`);
  await wait(1500); if (!alive()) return;
  let straggled = false;
  while (alive()) {
    await wait(400);
    // a delayed task fires mid-freeze: the clock resets, visibly -- it can't be fooled
    // early: the reset has to land while the bars are visibly moving, but every second before it
    // is a second added to the phase -- the clock restarts from zero either way
    if (!straggled && quietMin() > GRACE * 0.2) {
      straggled = true;
      quiet.default = 0;
      tails.default += 2;
      flash("group");
      feed("default", "one last org change applied — a delayed task fired after the freeze; its quiet clock resets");
    }
    renderSide();
    if (quietMin() >= GRACE) break;
  }
  if (!alive()) return;
  feed("move", `org quiet ≥ ${GRACE}s on every stream — upstream drained and everything applied, by observation alone`);
  feed(null, "files and metrics carried no org change this move: nothing to drain, so they stay neutral rather than going green");
  setPhase("freeze", "verifying the copy");
  await wait(1600); if (!alive()) return;
  feed("move", "every table and blob store matches on both sides");
  await gate("next: cut over ›"); if (!alive()) return;

  // the flip: effectively irreversible -- what remains is a parachute, not a road back
  setPhase("cutover", "flipping routing to the sink cell");
  feed("move", "operator: cut over");
  await wait(1500); if (!alive()) return;
  clearInterval(jitter);
  for (const n of Object.keys(quiet)) quiet[n] = null;
  for (const n of Object.keys(tails)) tails[n] = null;
  Object.values(paths).forEach(p => p.classList.remove("live"));
  feed("move", "routing flipped: evil-corp is now served by the sink cell; buffered writes replay there");
  feed("move", "streams stopped; slots + publications dropped — the source copy is retained, frozen at the flip point, until eviction");
  setPhase("cutover", "org is on the sink, evict source copy when confident");
  renderSide();
  await wait(2200); if (!alive()) return;
  feed("move", "sink cell healthy: ingest, queries and error rates nominal for evil-corp");
  feed(null, "the only exit left is a disaster revert — routing back to the frozen source copy, every sink write since the flip abandoned; the move is over either way");
  await gate("next: clean up ›"); if (!alive()) return;

  // teardown then the source copy. The order is the load-bearing part -- a surviving slot would
  // stream the coming deletes to the sink -- so it gets a line; the per-store delete walk does not
  setPhase("cleanup", "plumbing torn down, then the source copy deleted");
  feed("move", "operator: clean up");
  await wait(1400); if (!alive()) return;
  feed("move", "every slot and publication goes first — a surviving slot would stream the coming deletes to the sink");
  for (const s of STORES) {
    await wait(450); if (!alive()) return;
    // one line per store, mirroring the pair each of them wrote on the way in
    feed(s.name, `slot and publications dropped: ${pubName(s.name)}`);
  }
  await wait(1200); if (!alive()) return;
  feed("move", "source copy evicted — the move is complete");
  setPhase("done", "org moved — nothing of evil-corp remains on the old cell");
  onGo = () => location.reload();
  setCta("↻ replay");
  renderSide();
}

drawEdges();
addEventListener("resize", drawEdges);
play();
</script>
</body>
</html>
